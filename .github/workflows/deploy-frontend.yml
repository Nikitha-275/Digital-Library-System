name: Deploy Frontend (Vercel)

# Manual only. Nothing deploys automatically.
# Requires repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# The Vercel project's Root Directory must be set to "frontend-dev".

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build and deploy (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-dev/package-lock.json

      - name: Install and test before deploying
        working-directory: frontend-dev
        run: |
          npm ci
          npm run test:ci

      - name: Pull Vercel settings
        run: npx --yes vercel@latest pull --yes --environment=${{ inputs.target }} --token="$VERCEL_TOKEN"

      - name: Build
        shell: bash
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then flag="--prod"; else flag=""; fi
          npx --yes vercel@latest build $flag --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        shell: bash
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then flag="--prod"; else flag=""; fi
          url=$(npx --yes vercel@latest deploy --prebuilt $flag --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed (${{ inputs.target }}): $url" >> "$GITHUB_STEP_SUMMARY"
