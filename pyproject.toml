[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort, W: pycodestyle warnings, UP: pyupgrade
select = ["E", "F", "I", "W", "UP"]
ignore = ["B008"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Path",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
